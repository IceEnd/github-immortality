<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Immortality - 你的 GitHub 修仙之路</title>
    <meta name="description" content="GitHub Immortality 是一个美观的 GitHub 统计卡片生成器，以修仙系统为灵感，将你的 GitHub 贡献转化为神秘的修仙境界。">
    <meta name="keywords" content="GitHub, stats, card, immortality, 凡人修仙传, 统计卡片, 修仙">
    
    <!-- Open Graph -->
    <meta property="og:title" content="GitHub Immortality - 你的 GitHub 修仙之路">
    <meta property="og:description" content="将你的 GitHub 贡献转化为神秘的修仙境界。支持多种格式导出。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://github-immortality.vercel.app">
    
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="/api?username=IceEnd">
</head>
<body>
    <!-- GitHub Corner -->

    <a href="https://github.com/IceEnd/github-immortality" class="github-corner" aria-label="View source on GitHub" target="_blank"><svg width="80" height="80" viewBox="0 0 250 250" style="fill:#64CEAA; color:#fff; position: absolute; top: 0; border: 0; right: 0; z-index: 999" aria-hidden="true"><path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"/><path d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2" fill="currentColor" style="transform-origin: 130px 106px;" class="octo-arm"/><path d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z" fill="currentColor" class="octo-body"/></svg></a><style>.github-corner:hover .octo-arm{animation:octocat-wave 560ms ease-in-out}@keyframes octocat-wave{0%,100%{transform:rotate(0)}20%,60%{transform:rotate(-25deg)}40%,80%{transform:rotate(10deg)}}@media (max-width:500px){.github-corner:hover .octo-arm{animation:none}.github-corner .octo-arm{animation:octocat-wave 560ms ease-in-out}}</style>

    <header class="fade-in">
        <div class="container">
            <div class="language-switch">
                <button id="lang-toggle">English</button>
            </div>
            <h1 id="main-title">GitHub Immortality</h1>
            <p id="sub-title" class="tagline">你的 GitHub 旅程，化作一场修仙之途</p>
        </div>
    </header>

    <main class="container">
        <!-- 预览区域 -->
        <section class="preview-section fade-in">
            <div class="input-group">
                <input type="text" id="username-input" placeholder="输入 GitHub 用户名..." autocomplete="off">
                <button id="generate-btn">修炼</button>
            </div>

            <div id="preview-container" class="preview-card">
                <div id="loading-spinner" class="spinner hidden"></div>
                <div id="card-wrapper">
                    <!-- SVG 将在这里加载 -->
                    <img id="stats-card" src="/api?username=IceEnd" alt="GitHub Stats Card" class="hidden">
                </div>
                <div id="error-message" class="error hidden">无法获取该道友的修为，请检查用户名是否正确。</div>
            </div>
        </section>

        <!-- 复制区域 -->
        <section id="copy-section" class="copy-section fade-in hidden">
            <div class="tabs">
                <button class="tab-btn active" data-format="markdown">Markdown</button>
                <button class="tab-btn" data-format="html">HTML</button>
                <button class="tab-btn" data-format="url">Link</button>
            </div>
            <div class="code-container">
                <pre><code id="code-output"></code></pre>
                <button id="copy-btn">复制</button>
            </div>
            <p id="copy-feedback" class="feedback hidden">已复制到识海！</p>
        </section>
    </main>

    <footer class="fade-in">
        <div class="container">
            <p>
                <a href="https://github.com/IceEnd/github-immortality" target="_blank" class="github-link">
                    GitHub 仓库
                </a>
            </p>
            <p class="license">MIT License © Alchemy</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
