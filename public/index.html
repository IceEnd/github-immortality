<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

    <header class="fade-in">
        <div class="container">
            <div class="language-switch">
                <button id="lang-toggle">English</button>
            </div>
            <h1 id="main-title">GitHub Immortality</h1>
            <p id="sub-title" class="tagline">推演天地法则，洞察道友修为</p>
        </div>
    </header>

    <main class="container">
        <!-- 预览区域 -->
        <section class="preview-section fade-in">
            <div class="input-group">
                <input type="text" id="username-input" placeholder="输入 GitHub 用户名" autocomplete="off">
                <button id="generate-btn">生成</button>
            </div>

            <!-- 主题切换 -->
            <div class="theme-toggle" id="theme-switch">
                <div class="theme-toggle-track">
                    <div class="theme-toggle-slider" id="theme-slider"></div>
                    <button class="theme-option active" data-theme="light" id="theme-light-btn">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                        </svg>
                        <span>浅色</span>
                    </button>
                    <button class="theme-option" data-theme="dark" id="theme-dark-btn">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                        <span>深色</span>
                    </button>
                </div>
            </div>

            <div id="preview-container" class="preview-card">
                <div id="loading-overlay" class="loading-overlay hidden">
                    <div class="spinner"></div>
                </div>
                <div id="card-wrapper">
                    <!-- SVG 将在这里加载 -->
                    <img id="stats-card" alt="GitHub Stats Card" class="hidden">
                </div>
                <div id="error-message" class="error hidden">未找到该用户，请检查用户名。</div>
            </div>
        </section>

        <!-- 复制区域 -->
        <section id="copy-section" class="copy-section fade-in">
            <div class="tabs">
                <button class="tab-btn active" data-format="markdown">Markdown</button>
                <button class="tab-btn" data-format="html">HTML</button>
                <button class="tab-btn" data-format="url">Link</button>
            </div>
            <div class="code-container">
                <pre><code id="code-output"></code></pre>
                <button id="copy-btn">复制</button>
            </div>
            <p id="copy-feedback" class="feedback hidden">已复制到剪贴板</p>
        </section>
    </main>

    <footer class="fade-in">
        <div class="container">
            <p>
                <a href="https://github.com/IceEnd/github-immortality" target="_blank" class="github-link">
                    GitHub
                </a>
            </p>
            <p class="license">MIT License</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
